# Builds the pkgdown website and the live Montana key, and publishes them to
# the gh-pages branch (served at https://leipzig.github.io/dimoose/).
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Add the live Montana key and README media
        run: |
          dir.create("pkgdown-site/montana", showWarnings = FALSE)
          dimoose::exportWizard(dimoose::montanaKey(), "pkgdown-site/montana/index.html")
          file.copy("media", "pkgdown-site", recursive = TRUE)
          file.create("pkgdown-site/.nojekyll")
        shell: Rscript {0}

      # The page for people who do not use R: upload a spreadsheet, get the
      # wizard. R runs in the browser (webR); build.R bundles the R code the page
      # needs and checks it on the Montana key. Served at .../dimoose/webr/
      - name: Add the spreadsheet-to-wizard page
        run: Rscript webr/build.R pkgdown-site/webr

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: pkgdown-site
