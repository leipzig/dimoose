url: https://leipzig.github.io/dimoose/
destination: pkgdown-site

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles, montana, webr, news]
    right: [search, github]
  components:
    montana:
      text: Try the Montana key
      href: montana/index.html
    webr:
      text: Make a key without R
      href: webr/index.html

articles:
- title: Write your own key
  navbar: ~
  contents:
  - montana-hardwoods
  - published-key
- title: Generate keys from data
  navbar: Generate keys from data
  contents:
  - vision-keys
  - alignment-keys

reference:
- title: Keys
  desc: The dimoose key object and the ways to write or read one.
  contents:
  - dimoose
  - keyFromSpreadsheet
  - keyToSpreadsheet
  - keyFromText
  - parseTextKey
  - keyFromLeads
  - checkNames
- title: Exchange formats
  desc: >
    Character matrices and keys in the formats of other identification
    software: SDD (the TDWG standard), DELTA, Lucid and Xper.
  contents:
  - readSDD
  - readSDDKey
  - readDELTA
  - readLucid
  - readLucidKey
  - readXper
- title: FishBase
  contents:
  - importFishbase
  - parseFishbase
  - rawhtml
- title: Building keys from a matrix
  desc: A key generated from a table of taxa and their characters.
  contents:
  - keyFromMatrix
  - vibrioMatrix
  - generateTree
  - keyFromRpart
- title: Pruning and merging
  desc: Cut a key down to some taxa or to a place, or join two keys.
  contents:
  - pruneKey
  - regionalKey
  - mergeKeys
- title: Quality
  desc: How many steps a key takes, and how common each taxon is.
  contents:
  - keyQuality
  - occurrenceWeights
- title: Show and share a key
  desc: The interactive page (wizard), diagrams and tree formats.
  contents:
  - exportWizard
  - keyDiagram
  - toNewick
  - toIgraph
  - toTreedata
  - toAuspiceJSON
- title: Example keys and data
  contents:
  - exampleKeys
  - montana
  - arachnida
  - vibrio
  - phylotree17
  - phylotree17_mutations
  - phylotreeKey
- title: "Vision: models and embeddings"
  desc: Vision models (PyTorch or ONNX Runtime), photos and their embeddings.
  contents:
  - visionModel
  - onnxModel
  - onnxCache
  - exportOnnxModel
  - exportBrowserModel
  - modelMeta
  - imageSet
  - imageMeta
  - imageMime
  - embedImages
  - embedTexts
  - saveEmbeddings
- title: "Vision: keys from photos"
  contents:
  - discoverSniglets
  - snigletScores
  - keyFromSniglets
  - snigletNames
  - renameSniglets
  - suggestSnigletNames
  - claudeNamer
  - inventNames
  - vocabularyPrompts
  - keyFromClusters
  - patchExemplars
  - scoreImages
  - suggestSpecies
  - identifyPhotos
  - featureTable
  - featureScores
  - classify
  - evaluateKey
  - looKey
- title: Benchmark
  desc: Identification measured on field photos from iNaturalist.
  contents:
  - inatPhotos
  - splitByObservation
  - benchmarkKey
- title: Keys from sequences and haplogroups
  contents:
  - keyFromAlignment
  - alignmentScores
  - readHaplogrep
  - haplotypeMatrix
  - macroHaplogroup
  - recurrentPositions
